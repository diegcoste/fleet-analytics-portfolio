name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests data scripts
      - name: Escaneo de datos sensibles
        run: python scripts/scan_sensitive.py
      - name: Tests
        run: pytest -q
      - name: Demo con datos sintéticos
        run: |
          python data/synthetic/generate.py --unidades 200
          python -m fleetlib.demo
